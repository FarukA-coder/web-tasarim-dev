<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Doğrulama Örneği</title>
    
    <link rel="stylesheet" href="style.css"> 
    
    <script src="script.js" defer></script> 
</head>
<body>
    <form name="loginForm" method="post" action="success.html" onsubmit="return verify();">
        <table border="0">
            <tr>
                <td colspan="2" align="center">
                    <h2>Form Name/Title</h2>
                </td>
            </tr>
            <tr>
                <td>User:</td>
                <td>
                    <input type="text" name="user" id="user" class="inpBox" />
                </td>
            </tr>
            <tr>
                <td>Pass:</td>
                <td>
                    <input type="password" name="pass" id="pass" class="inpBox" />
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="submit" value="Submit" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
