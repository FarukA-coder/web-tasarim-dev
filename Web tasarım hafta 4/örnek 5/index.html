<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
  padding: 5px;
}
</style>
</head>
<body>

<h2>Ünlüler Listesi (AJAX - TXT)</h2>

<button type="button" onclick="loadCelebs()">Ünlüleri Getir</button>
<br><br>

<table id="demo"></table>

<script>
function loadCelebs() {
  const xhttp = new XMLHttpRequest();
  xhttp.onload = function() {
    document.getElementById("demo").innerHTML = this.responseText;
  }
  xhttp.open("GET", "celebs.txt", true);
  xhttp.send();
}
</script>

</body>
</html>
